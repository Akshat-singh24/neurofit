else if(k=="gml"){const nm=new Set(gitems().map(i=>i.n.toLowerCase()));let c=0;for(let o=0;o<7;o++)S.meals.filter(x=>x.d==D(o)).forEach(x=>{const k2=Object.keys(ING).find(z=>(x.nm||"").toLowerCase().startsWith(z.toLowerCase()));if(!k2)return;const n=ING[k2];if(nm.has(n.toLowerCase()))return;nm.add(n.toLowerCase());const g=GR.find(i=>i[0]==n),e=EXTRA[n]||[];S.gi.push(gmk(n,g?g[1]:e[0],g?g[2]:e[1],g?g[3]:e[2]));c++});msg=c?"Added "+c+" ingredient"+(c>1?"s":"")+" from your last 7 days of meals.":"No new ingredients found in your last 7 days of meals."}
else if(k=="gclr"){S.gi=gitems().filter(y=>!y.x);msg="Cleared purchased items."}

else if(k=="gcp"){const s="NeuroFit grocery list\n"+gitems().filter(i=>!i.x).map(i=>`${i.n} ${i.q} - ₹${i.p}`).join("\n");try{navigator.clipboard.writeText(s).then(()=>{msg="Copied the items still to buy.";render()},()=>{msg="Copy blocked. Select and copy manually.";render()})}catch(e){msg="Copy isn’t available here.";render()}return}

else if(k=="wlog"){const w=+$("#wi").value;if(!(w>=25&&w<=250)){bsm="Enter a weight between 25 and 250 kg.";render();return}const r=Math.round(w*10)/10;S.wl=(S.wl||[]).filter(x=>x.d!=D());S.wl.push({d:D(),w:r});bs().wt=r;bsm="Weight logged."}

else if(k=="cspk"){sp===+d.i?stopSpeak():speak(+d.i)}

else if(k=="mic"){mic();return}else if(k=="stp"){rcStop();return}else if(k=="cp"){cp(d.w);return}
